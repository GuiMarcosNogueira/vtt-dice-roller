version: 2
updates:
  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Python backend (api)
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Next.js frontend (web)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
