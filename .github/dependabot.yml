version: 2

# Para não inundar o repositório de PRs, as atualizações são agrupadas por assunto:
# um PR por grupo em vez de um PR por pacote. O Dependabot usa o primeiro grupo que
# combina com a dependência, então os grupos específicos vêm antes dos genéricos.
updates:
  # GitHub Actions usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    groups:
      github-actions:
        patterns:
          - "*"

  # Backend Python (api)
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    groups:
      # Minor e patch juntos; saltos de versão maior continuam em PRs separados,
      # porque podem quebrar a API e merecem revisão individual
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend Next.js (web)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    groups:
      # react e react-dom precisam andar na mesma versão
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # next e eslint-config-next são fixados na mesma versão exata
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node acompanha a versão do Node usada na CI (22.x); saltos de versão
      # maior dos tipos não devem ir à frente do runtime
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
